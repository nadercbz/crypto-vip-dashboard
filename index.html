<script>
/* Offline-Faehigkeit wie auf der alten VIP-Seite, nur unter https (GitHub Pages).
   Kommt eine neue Fassung an, einmal neu laden. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
            reg.addEventListener('updatefound', function () {
                var neu = reg.installing;
                if (!neu) return;
                neu.addEventListener('statechange', function () {
                    if (neu.state === 'installed' && navigator.serviceWorker.controller) location.reload();
                });
            });
        }).catch(function () {});
    });
}
</script>
